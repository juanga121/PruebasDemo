project:
  name: PruebasDemo
  description: "ASP.NET Core 8 Web API para gestión de créditos — arquitectura limpia por capas con énfasis en testabilidad"
  language: "C# 12"
  runtime: "dotnet 8.0"
  solution: "PruebasDemo.sln"

architecture:
  style: "clean-layered"
  layers:
    - name: "PruebasDemo (API)"
      path: "PruebasDemo/"
      responsibility: "Controllers, middleware, configuration, DI wiring"
    - name: "PruebasDemo.Application"
      path: "PruebasDemo.Application/"
      responsibility: "Business logic, service interfaces, DTOs, validators"
    - name: "PruebasDemo.Domain"
      path: "PruebasDemo.Domain/"
      responsibility: "Entities, enums, domain-level DTOs"
    - name: "PruebasDemo.Infrastructure"
      path: "PruebasDemo.Infrastructure/"
      responsibility: "EF Core DataContext, generic repository, persistence"
  patterns:
    - "Generic Repository: IGenericRepository<T, TKey> → GenericRepository<T, TKey>"
    - "Dependency Injection via Microsoft.Extensions.DependencyInjection"
  constraints:
    - "Domain has zero external dependencies (only FluentValidation)"
    - "Application references Domain only"
    - "Infrastructure references Application and Domain"
    - "API references all layers"

persistence:
  provider: "Entity Framework Core 9.0.10"
  database: "SQL Server (production) / InMemory (testing)"
  connection_key: "ConexionDB"

validation:
  framework: "FluentValidation 11.3.1"
  validators:
    - "CreditoDtoValidator (in PruebasDemo.Application.Validators)"
    - "PagarCuotaDtoValidator"

logging:
  provider: "Serilog 9.0.0"
  sinks:
    - "Console"
    - "File (rolling daily: logs/log-.txt)"

testing:
  strict_tdd: true
  runner: "dotnet test"
  framework: "xUnit 2.5.3"
  layers:
    unit:
      available: true
      tools: ["xUnit", "Moq 4.20.72"]
      path: "PruebaDemoTest/PruebasUnitarias/"
    integration:
      available: true
      tools: ["WebApplicationFactory<Program>", "EF Core InMemory"]
      path: "PruebaDemoTest/PruebasIntegracion/"
    e2e:
      available: false
      tools: []
  coverage:
    available: true
    tool: "coverlet.msbuild 8.0.1"
    command: "dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=opencover"
  ci:
    provider: "GitHub Actions"
    sonarcloud: true
    project_key: "juanga121_PruebasDemo"

sdd:
  mode: "openspec"
  workflow:
    - propose
    - spec
    - design
    - tasks
    - apply
    - verify
    - archive
  directory: "openspec/"
  pending_changes: "openspec/changes/"
  archived_changes: "openspec/changes/archive/"
  specs_dir: "openspec/specs/"
